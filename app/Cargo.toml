[package]
name = "atray"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "=0.2.2"
futures = "0.3"
atray-core = { path = "../core" }
# Même version que gpui : ne sert qu'à construire ses `Frame` à partir des pixels de Windows.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.9"
tray-icon = "0.26"
raw-window-handle = "0.6"
windows-registry = "0.5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Déjà utilisé par gpui : icône de l'exe et du tray.
embed-resource = "3"
